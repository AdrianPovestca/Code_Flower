<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Forest</title>
    <style>
        *,
        *::after,
        *::before {
          padding: 0;
          margin: 0;
          box-sizing: border-box;
        }

        :root {
          --dark-color: #000;
        }

        body {
          display: flex;
          align-items: flex-end;
          justify-content: center;
          min-height: 100vh;
          background-color: var(--dark-color);
          overflow: hidden;
          perspective: 1000px;
        }

        .night {
          position: fixed;
          left: 50%;
          top: 0;
          transform: translateX(-50%);
          width: 100%;
          height: 100%;
          filter: blur(0.1vmin);
          background-image: radial-gradient(ellipse at top, transparent 0%, var(--dark-color)), radial-gradient(ellipse at bottom, var(--dark-color), rgba(145, 233, 255, 0.2)), repeating-linear-gradient(220deg, rgb(0, 0, 0) 0px, rgb(0, 0, 0) 19px, transparent 19px, transparent 22px), repeating-linear-gradient(189deg, rgb(0, 0, 0) 0px, rgb(0, 0, 0) 19px, transparent 19px, transparent 22px), repeating-linear-gradient(148deg, rgb(0, 0, 0) 0px, rgb(0, 0, 0) 19px, transparent 19px, transparent 22px), linear-gradient(90deg, rgb(7, 107, 42), rgb(240, 240, 240));
        }

        .flowers {
          position: relative;
          transform: scale(0.9);
        }

        .flower {
          position: absolute;
          bottom: 10vmin;
          transform-origin: bottom center;
          z-index: 10;
          --fl-speed: 0.3s;
          will-change: transform;
        }

        /* ORIGINAL 3 FLOWERS */
        .flower--1 {
          -webkit-animation: moving-flower-1 4s linear infinite;
          animation: moving-flower-1 4s linear infinite;
        }
        .flower--1 .flower__line {
          height: 70vmin;
          -webkit-animation-delay: 0.3s;
          animation-delay: 0.3s;
        }

        .flower--2 {
          left: 50%;
          transform: rotate(20deg);
          -webkit-animation: moving-flower-2 4s linear infinite;
          animation: moving-flower-2 4s linear infinite;
        }
        .flower--2 .flower__line {
          height: 60vmin;
          -webkit-animation-delay: 0.6s;
          animation-delay: 0.6s;
        }

        .flower--3 {
          left: 50%;
          transform: rotate(-15deg);
          -webkit-animation: moving-flower-3 4s linear infinite;
          animation: moving-flower-3 4s linear infinite;
        }
        .flower--3 .flower__line {
          -webkit-animation-delay: 0.9s;
          animation-delay: 0.9s;
        }

        /* NEW FLOWERS 4-15 */
        .flower--4 {
          left: -30vmin;
          transform: scale(0.7) rotate(-25deg);
          -webkit-animation: moving-flower-4 5s linear infinite;
          animation: moving-flower-4 5s linear infinite;
          z-index: 5;
        }
        .flower--4 .flower__line {
          height: 50vmin;
          -webkit-animation-delay: 0.2s;
          animation-delay: 0.2s;
        }

        .flower--5 {
          left: 60vmin;
          transform: scale(0.75) rotate(35deg);
          -webkit-animation: moving-flower-5 4.5s linear infinite;
          animation: moving-flower-5 4.5s linear infinite;
          z-index: 6;
        }
        .flower--5 .flower__line {
          height: 55vmin;
          -webkit-animation-delay: 0.4s;
          animation-delay: 0.4s;
        }

        .flower--6 {
          left: -15vmin;
          transform: scale(0.8) rotate(-10deg);
          -webkit-animation: moving-flower-6 4.8s linear infinite;
          animation: moving-flower-6 4.8s linear infinite;
          z-index: 7;
        }
        .flower--6 .flower__line {
          height: 65vmin;

          animation-delay: 0.5s;
        }

        .flower--7 {

          transform: scale(0.72) rotate(10deg);
          -webkit-animation: moving-flower-7 4.3s linear infinite;
          animation: moving-flower-7 4.3s linear infinite;
          z-index: 4;
        }
        .flower--7 .flower__line {
          height: 58vmin;
          -webkit-animation-delay: 0.7s;
          animation-delay: 0.7s;
        }

        .flower--8 {
          left: -45vmin;
          transform: scale(0.65) rotate(-35deg);
          -webkit-animation: moving-flower-8 5.2s linear infinite;
          animation: moving-flower-8 5.2s linear infinite;
          z-index: 3;
        }
        .flower--8 .flower__line {
          height: 48vmin;
          -webkit-animation-delay: 0.1s;
          animation-delay: 0.1s;
        }

        .flower--9 {

          transform: scale(0.78) rotate(45deg);
          -webkit-animation: moving-flower-9 4.7s linear infinite;
          animation: moving-flower-9 4.7s linear infinite;

          animation: moving-flower-10 4.4s linear infinite;

        }
        .flower--10 .flower__line {
          height: 68vmin;
          -webkit-animation-delay: 0.8s;
          animation-delay: 0.8s;
        }

        .flower--11 {
          left: -60vmin;
          transform: scale(0.7) rotate(-45deg);
          -webkit-animation: moving-flower-11 5s linear infinite;
          animation: moving-flower-11 5s linear infinite;
          z-index: 2;
        }
        .flower--11 .flower__line {
          height: 52vmin;
          -webkit-animation-delay: 0.3s;
          animation-delay: 0.3s;
        }

        .flower--12 {
          left: 30vmin;
          transform: scale(0.75) rotate(-20deg);
          -webkit-animation: moving-flower-12 4.6s linear infinite;
          animation: moving-flower-12 4.6s linear infinite;
          z-index: 6;
        }
        .flower--12 .flower__line {
          height: 62vmin;
          -webkit-animation-delay: 0.5s;
          animation-delay: 0.5s;
        }

        .flower--13 {
          left: 80vmin;
          transform: scale(0.68) rotate(50deg);
          -webkit-animation: moving-flower-13 4.9s linear infinite;
          animation: moving-flower-13 4.9s linear infinite;
          z-index: 4;
        }
        .flower--13 .flower__line {
          height: 54vmin;
          -webkit-animation-delay: 0.4s;
          animation-delay: 0.4s;
        }

        .flower--14 {
          left: -20vmin;
          transform: scale(0.8) rotate(15deg);
          -webkit-animation: moving-flower-14 4.5s linear infinite;
          animation: moving-flower-14 4.5s linear infinite;
          z-index: 7;
        }
        .flower--14 .flower__line {
          height: 66vmin;
          -webkit-animation-delay: 0.6s;
          animation-delay: 0.6s;
        }

        .flower--15 {
          left: 55vmin;
          transform: scale(0.73) rotate(-30deg);
          -webkit-animation: moving-flower-15 4.8s linear infinite;
          animation: moving-flower-15 4.8s linear infinite;
          z-index: 5;
        }
        .flower--15 .flower__line {
          height: 59vmin;
          -webkit-animation-delay: 0.7s;
          animation-delay: 0.7s;
        }

        /* ANIMATIONS */
        @-webkit-keyframes moving-flower-1 {
          0%, 100% { transform: rotate(2deg); }
          50% { transform: rotate(-2deg); }
        }
        @keyframes moving-flower-1 {
          0%, 100% { transform: rotate(2deg); }
          50% { transform: rotate(-2deg); }
        }

        @-webkit-keyframes moving-flower-2 {
          0%, 100% { transform: rotate(20deg); }
          50% { transform: rotate(16deg); }
        }
        @keyframes moving-flower-2 {
          0%, 100% { transform: rotate(20deg); }
          50% { transform: rotate(16deg); }
        }

        @-webkit-keyframes moving-flower-3 {
          0%, 100% { transform: rotate(-18deg); }
          50% { transform: rotate(-20deg) rotateY(-10deg); }
        }
        @keyframes moving-flower-3 {
          0%, 100% { transform: rotate(-18deg); }
          50% { transform: rotate(-20deg) rotateY(-10deg); }
        }

        @-webkit-keyframes moving-flower-4 {
          0%, 100% { transform: scale(0.7) rotate(-25deg); }
          50% { transform: scale(0.7) rotate(-22deg) rotateY(-8deg); }
        }
        @keyframes moving-flower-4 {
          0%, 100% { transform: scale(0.7) rotate(-25deg); }
          50% { transform: scale(0.7) rotate(-22deg) rotateY(-8deg); }
        }

        @-webkit-keyframes moving-flower-5 {
          0%, 100% { transform: scale(0.75) rotate(35deg); }
          50% { transform: scale(0.75) rotate(32deg) rotateY(8deg); }
        }
        @keyframes moving-flower-5 {
          0%, 100% { transform: scale(0.75) rotate(35deg); }
          50% { transform: scale(0.75) rotate(32deg) rotateY(8deg); }
        }

        @-webkit-keyframes moving-flower-6 {
          0%, 100% { transform: scale(0.8) rotate(-10deg); }
          50% { transform: scale(0.8) rotate(-8deg) rotateY(-5deg); }
        }
        @keyframes moving-flower-6 {
          0%, 100% { transform: scale(0.8) rotate(-10deg); }
          50% { transform: scale(0.8) rotate(-8deg) rotateY(-5deg); }
        }

        @-webkit-keyframes moving-flower-7 {
          0%, 100% { transform: scale(0.72) rotate(10deg); }
          50% { transform: scale(0.72) rotate(8deg) rotateY(5deg); }
        }
        @keyframes moving-flower-7 {
          0%, 100% { transform: scale(0.72) rotate(10deg); }
          50% { transform: scale(0.72) rotate(8deg) rotateY(5deg); }
        }

        @-webkit-keyframes moving-flower-8 {
          0%, 100% { transform: scale(0.65) rotate(-35deg); }
          50% { transform: scale(0.65) rotate(-32deg) rotateY(-10deg); }
        }
        @keyframes moving-flower-8 {
          0%, 100% { transform: scale(0.65) rotate(-35deg); }
          50% { transform: scale(0.65) rotate(-32deg) rotateY(-10deg); }
        }

        @-webkit-keyframes moving-flower-9 {
          0%, 100% { transform: scale(0.78) rotate(45deg); }
          50% { transform: scale(0.78) rotate(42deg) rotateY(10deg); }
        }
        @keyframes moving-flower-9 {
          0%, 100% { transform: scale(0.78) rotate(45deg); }
          50% { transform: scale(0.78) rotate(42deg) rotateY(10deg); }
        }

        @-webkit-keyframes moving-flower-10 {
          0%, 100% { transform: scale(0.82) rotate(5deg); }
          50% { transform: scale(0.82) rotate(7deg) rotateY(6deg); }
        }
        @keyframes moving-flower-10 {
          0%, 100% { transform: scale(0.82) rotate(5deg); }
          50% { transform: scale(0.82) rotate(7deg) rotateY(6deg); }
        }

        @-webkit-keyframes moving-flower-11 {
          0%, 100% { transform: scale(0.7) rotate(-45deg); }
          50% { transform: scale(0.7) rotate(-42deg) rotateY(-12deg); }
        }
        @keyframes moving-flower-11 {
          0%, 100% { transform: scale(0.7) rotate(-45deg); }
          50% { transform: scale(0.7) rotate(-42deg) rotateY(-12deg); }
        }

        @-webkit-keyframes moving-flower-12 {
          0%, 100% { transform: scale(0.75) rotate(-20deg); }
          50% { transform: scale(0.75) rotate(-18deg) rotateY(-7deg); }
        }
        @keyframes moving-flower-12 {
          0%, 100% { transform: scale(0.75) rotate(-20deg); }
          50% { transform: scale(0.75) rotate(-18deg) rotateY(-7deg); }
        }

        @-webkit-keyframes moving-flower-13 {
          0%, 100% { transform: scale(0.68) rotate(50deg); }
          50% { transform: scale(0.68) rotate(47deg) rotateY(11deg); }
        }
        @keyframes moving-flower-13 {
          0%, 100% { transform: scale(0.68) rotate(50deg); }
          50% { transform: scale(0.68) rotate(47deg) rotateY(11deg); }
        }

        @-webkit-keyframes moving-flower-14 {
          0%, 100% { transform: scale(0.8) rotate(15deg); }
          50% { transform: scale(0.8) rotate(17deg) rotateY(6deg); }
        }
        @keyframes moving-flower-14 {
          0%, 100% { transform: scale(0.8) rotate(15deg); }
          50% { transform: scale(0.8) rotate(17deg) rotateY(6deg); }
        }

        @-webkit-keyframes moving-flower-15 {
          0%, 100% { transform: scale(0.73) rotate(-30deg); }
          50% { transform: scale(0.73) rotate(-27deg) rotateY(-9deg); }
        }
        @keyframes moving-flower-15 {
          0%, 100% { transform: scale(0.73) rotate(-30deg); }
          50% { transform: scale(0.73) rotate(-27deg) rotateY(-9deg); }
        }

        /* REST OF YOUR ORIGINAL STYLES */
        .flower__leafs {
          position: relative;
          -webkit-animation: blooming-flower 1.5s backwards;
          animation: blooming-flower 1.5s backwards;
          will-change: transform;
        }

        .flower__leafs--1 {
          -webkit-animation-delay: 1.1s;
          animation-delay: 1.1s;
        }
        .flower__leafs--2 {
          -webkit-animation-delay: 1.4s;
          animation-delay: 1.4s;
        }
        .flower__leafs--3 {
          -webkit-animation-delay: 1.7s;
          animation-delay: 1.7s;
        }

        .flower__leafs::after {
          content: "";
          position: absolute;
          left: 0;
          top: 0;
          transform: translate(-50%, -100%);
          width: 8vmin;
          height: 8vmin;
          background-color: #6bf0ff;
          filter: blur(10vmin);
        }

        .flower__leaf {
          position: absolute;
          bottom: 0;
          left: 50%;
          width: 8vmin;
          height: 11vmin;
          border-radius: 51% 49% 47% 53%/44% 45% 55% 69%;
          background-color: #f672b0;
          background-image: linear-gradient(to top, #ee5286, #ee5286);
          transform-origin: bottom center;
          opacity: 0.9;
          box-shadow: inset 0 0 2vmin rgba(255, 255, 255, 0.5);
        }

        .flower__leaf--1 { transform: translate(-10%, 1%) rotateY(40deg) rotateX(-50deg); }
        .flower__leaf--2 { transform: translate(-50%, -4%) rotateX(40deg); }
        .flower__leaf--3 { transform: translate(-90%, 0%) rotateY(45deg) rotateX(50deg); }
        .flower__leaf--4 {
          width: 8vmin;
          height: 8vmin;
          transform-origin: bottom left;
          border-radius: 4vmin 10vmin 4vmin 4vmin;
          transform: translate(0%, 18%) rotateX(70deg) rotate(-43deg);
          background-image: linear-gradient(to top, #ee5286, #ee5286);
          z-index: 1;
          opacity: 0.8;
        }

        .flower__white-circle {
          position: absolute;
          left: -3.5vmin;
          top: -3vmin;
          width: 9vmin;
          height: 4vmin;
          border-radius: 50%;
          background-color: #fff;
        }

        .flower__white-circle::after {
          content: "";
          position: absolute;
          left: 50%;
          top: 45%;
          transform: translate(-50%, -50%);
          width: 60%;
          height: 60%;
          border-radius: inherit;
          background-image: linear-gradient(90deg, rgb(127, 47, 21), rgb(255, 206, 0));
        }

        .flower__line {
          height: 55vmin;
          width: 1.5vmin;
          background-image: linear-gradient(to left, rgba(0, 0, 0, 0.2), transparent, rgba(255, 255, 255, 0.2)), linear-gradient(to top, transparent 10%, #583e08, #944415);
          box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.5);
          transform-origin: bottom center;
          -webkit-animation: grow-flower-tree 2s backwards;
          animation: grow-flower-tree 2s backwards;
          will-change: transform;
        }

        .flower__line__leaf {
          --w: 7vmin;
          --h: calc(var(--w) + 2vmin);
          position: absolute;
          top: 20%;
          left: 90%;
          width: var(--w);
          height: var(--h);
          border-top-right-radius: var(--h);
          border-bottom-left-radius: var(--h);
          background-image: linear-gradient(to top, rgba(20, 117, 122, 0.4), #095721);
        }

        .flower__line__leaf--1 { transform: rotate(70deg) rotateY(30deg); }
        .flower__line__leaf--2 { top: 45%; transform: rotate(70deg) rotateY(30deg); }
        .flower__line__leaf--3, .flower__line__leaf--4, .flower__line__leaf--6 {
          border-top-right-radius: 0;
          border-bottom-left-radius: 0;
          border-top-left-radius: var(--h);
          border-bottom-right-radius: var(--h);
          left: -460%;
          top: 12%;
          transform: rotate(-70deg) rotateY(30deg);
        }
        .flower__line__leaf--4 { top: 40%; }
        .flower__line__leaf--5 {
          top: 0;
          transform-origin: left;
          transform: rotate(70deg) rotateY(30deg) scale(0.6);
        }
        .flower__line__leaf--6 {
          top: -2%;
          left: -450%;
          transform-origin: right;
          transform: rotate(-70deg) rotateY(30deg) scale(0.6);
        }

        .flower__light {
          position: absolute;
          bottom: 0vmin;
          width: 1vmin;
          height: 1vmin;
          background-color: rgb(255, 251, 0);
          border-radius: 50%;
          filter: blur(0.2vmin);
          -webkit-animation: light-ans 3s linear infinite backwards;
          animation: light-ans 3s linear infinite backwards;
          will-change: transform, opacity;
        }

        .flower__light:nth-child(odd) { background-color: #f76baf; }
        .flower__light--1 { left: -2vmin; -webkit-animation-delay: 0.7s; animation-delay: 0.7s; }
        .flower__light--2 { left: 3vmin; -webkit-animation-delay: 0.3s; animation-delay: 0.3s; }
        .flower__light--3 { left: -6vmin; -webkit-animation-delay: 0.1s; animation-delay: 0.1s; }
        .flower__light--4 { left: 6vmin; -webkit-animation-delay: 0.6s; animation-delay: 0.6s; }
        .flower__light--5 { left: -1vmin; -webkit-animation-delay: 1s; animation-delay: 1s; }
        .flower__light--6 { left: -4vmin; -webkit-animation-delay: 2s; animation-delay: 2s; }
        .flower__light--7 { left: 3vmin; -webkit-animation-delay: 1.4s; animation-delay: 1.4s; }
        .flower__light--8 { left: -6vmin; -webkit-animation-delay: 2.4s; animation-delay: 2.4s; }

        @-webkit-keyframes blooming-leaf-right {
          0% {
            transform-origin: left;
            transform: rotate(70deg) rotateY(30deg) scale(0);
          }
        }
        @keyframes blooming-leaf-right {
          0% {
            transform-origin: left;
            transform: rotate(70deg) rotateY(30deg) scale(0);
          }
        }

        @-webkit-keyframes blooming-leaf-left {
          0% {
            transform-origin: right;
            transform: rotate(-70deg) rotateY(30deg) scale(0);
          }
        }
        @keyframes blooming-leaf-left {
          0% {
            transform-origin: right;
            transform: rotate(-70deg) rotateY(30deg) scale(0);
          }
        }

        @-webkit-keyframes grow-flower-tree {
          0% {
            transform: scaleY(0);
          }
        }
        @keyframes grow-flower-tree {
          0% {
            transform: scaleY(0);
          }
        }

        @-webkit-keyframes blooming-flower {
          0% {
            transform: scale(0);
          }
        }
        @keyframes blooming-flower {
          0% {
            transform: scale(0);
          }
        }

        @-webkit-keyframes light-ans {
          0% {
            opacity: 0;
            transform: translateY(0vmin);
            filter: blur(0.2vmin);
          }
          30% {
            opacity: 1;
            transform: translateY(-5vmin) translateX(-2vmin);
            filter: blur(0.2vmin);
          }
          60% {
            opacity: 1;
            transform: translateY(-15vmin) translateX(2vmin);
            filter: blur(0.3vmin);
          }
          100% {
            transform: translateY(-25vmin);
            opacity: 0;
            filter: blur(1vmin);
          }
        }
        @keyframes light-ans {
          0% {
            opacity: 0;
            transform: translateY(0vmin);
            filter: blur(0.2vmin);
          }
          30% {
            opacity: 1;
            transform: translateY(-5vmin) translateX(-2vmin);
            filter: blur(0.2vmin);
          }
          60% {
            opacity: 1;
            transform: translateY(-15vmin) translateX(2vmin);
            filter: blur(0.3vmin);
          }
          100% {
            transform: translateY(-25vmin);
            opacity: 0;
            filter: blur(1vmin);
          }
        }
    </style>
</head>
